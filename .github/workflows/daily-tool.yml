name: Daily Tool

# Four daily attempts (00/06/12/18 UTC) — each run is budget-capped and
# exits green when the AI provider is rate-limited, so a busy free tier
# never turns the schedule red. Also runnable manually with a
# custom tool count (Actions → Daily Tool → Run workflow).
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many new tools to add this run'
        required: true
        default: '1'

permissions:
  contents: write

# Never let two runs race each other (a second queued run just adds the next tool).
concurrency:
  group: daily-tool
  cancel-in-progress: false

jobs:
  add-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Optional AI features (Groq free tier). Without a key both features
      # silently disable: ranking falls back to catalog order and tools come
      # from vetted factories. With a key, the AI author also WRITES a new
      # custom tool module — which still must pass the full quality gate.
      - name: Generate today's tool (tests + build + verify are the gate)
        id: add
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # GitHub does not expose secrets as env vars automatically — without
          # this export the Zen provider falls back to the Groq key and wrong
          # endpoint, causing 401/429 failures in the runner.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Empty when the var is unset; lib/ai.mjs then picks the provider's
          # correct default model (deepseek-chat for zen, llama-3.3-70b for groq).
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'auto' }}
          AI_BUDGET: ${{ vars.AI_BUDGET || '4' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          node scripts/add-daily-tool.mjs --count "$COUNT" > add.log
          cat add.log
          grep -E '^ADDED_TOOLS=' add.log >> "$GITHUB_OUTPUT" || echo 'ADDED_TOOLS=' >> "$GITHUB_OUTPUT"


      - name: Install Playwright and dependencies
        if: steps.add.outputs.ADDED_TOOLS != '' && steps.add.outputs.ADDED_TOOLS != 'none'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Take screenshots of new tool
        if: steps.add.outputs.ADDED_TOOLS != '' && steps.add.outputs.ADDED_TOOLS != 'none'
        run: |
          node scripts/build.mjs
          node scripts/take-screenshots.mjs
        env:
          ADDED_TOOLS: ${{ steps.add.outputs.ADDED_TOOLS }}

      - name: Commit and push
        if: steps.add.outputs.ADDED_TOOLS != '' && steps.add.outputs.ADDED_TOOLS != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(tools): add ${{ steps.add.outputs.ADDED_TOOLS }} [daily]"
          git pull --rebase origin main
          git push

      # Guardrail: a green run that produced NO tool is a silent pipeline
      # failure (e.g. every AI call died). Fail the job loudly so GitHub
      # notifies instead of pretending everything is fine.
      - name: Fail if no tool was generated
        if: steps.add.outputs.ADDED_TOOLS == '' || steps.add.outputs.ADDED_TOOLS == 'none'
        run: |
          echo "::error::Daily run finished with ADDED_TOOLS='${{ steps.add.outputs.ADDED_TOOLS }}' — no tool was generated or committed. Check the 'Generate today'\''s tool' step log."
          exit 1

      - name: Post to Instagram & Facebook
        if: steps.add.outputs.ADDED_TOOLS != '' && steps.add.outputs.ADDED_TOOLS != 'none'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://toolnova.vercel.app' }}
          ADDED_TOOLS: ${{ steps.add.outputs.ADDED_TOOLS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/post-to-socials.mjs


# Vercel deploys the push automatically via its Git integration
# (vercel.json: buildCommand "node scripts/build.mjs", outputDirectory "dist").
