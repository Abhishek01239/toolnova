name: Daily Tool (DISABLED)

# Disabled — daily tool creation is handled by Grok Automations, not GitHub Actions.
# Keep this file so history is clear; no schedule runs.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "This workflow is disabled. Use the Grok daily-tool automation instead."
        required: false
        default: "disabled"

jobs:
  disabled:
    name: Disabled — use Grok automation
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: |
          echo "Daily tool automation was moved to Grok Automations."
          echo "This GitHub Action is intentionally disabled."
          exit 0
